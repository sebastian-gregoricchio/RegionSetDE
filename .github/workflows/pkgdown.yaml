# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# The site is built from two branches: the package source comes from 'main', the
# pkgdown configuration from 'devel-tools', where this workflow lives. The two
# checkouts below put them together in the same working tree
on:
  push:
    branches: [devel-tools]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Bioconductor 3.24, the devel branch, runs on R 4.6. consensusRegions is only
      # there, so pak must not fall back on the release repositories
      R_BIOC_VERSION: "3.24"
    permissions:
      contents: write
    steps:
      # Package source
      - uses: actions/checkout@v5
        with:
          ref: main

      # '_pkgdown.yaml' was removed from 'main' and is taken from here. 'path'
      # keeps it out of the package root, so nothing stray ends up in the tree
      - uses: actions/checkout@v5
        with:
          ref: devel-tools
          path: .pkgdown-config
          sparse-checkout: |
            _pkgdown.yaml
          sparse-checkout-cone-mode: false

      - name: Restore the pkgdown configuration
        run: cp .pkgdown-config/_pkgdown.yaml . && rm -rf .pkgdown-config
        shell: bash

      - uses: r-lib/actions/setup-pandoc@v2

      # pak resolves the Bioconductor dependencies from biocViews
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # consensusRegions is in Bioconductor devel but has no source package there
      # yet, so pak cannot find it. Until it has one, this run adds a 'Remotes'
      # field pointing at GitHub. It is never committed. Delete this step once the
      # Bioconductor page of consensusRegions lists a source package
      - name: Take consensusRegions from GitHub
        run: |
          descriptionLines <- readLines("DESCRIPTION", warn = FALSE)
          writeLines(c(descriptionLines, "Remotes: sebastian-gregoricchio/consensusRegions"), "DESCRIPTION")
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
