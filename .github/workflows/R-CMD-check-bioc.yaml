# Adapted from https://github.com/r-lib/actions/tree/v2/examples, with the
# Bioconductor repositories and BiocCheck added.
#
# The matrix mirrors the three platforms the Bioconductor build system runs on,
# against both the release and the devel branch. BiocCheck runs once, on devel,
# since that is the branch a submission is reviewed against.
name: R-CMD-check-bioc

on:
  push:
    branches: [main, master, devel]
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  R-CMD-check-bioc:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }} / Bioc ${{ matrix.config.bioc }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,   r: 'devel',   bioc: 'devel'}
          - {os: ubuntu-latest,   r: 'release', bioc: 'release'}
          - {os: macos-latest,    r: 'release', bioc: 'release'}
          - {os: windows-latest,  r: 'release', bioc: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v5

      # Required to knit the vignette during the check
      - uses: r-lib/actions/setup-pandoc@v2

      # 'bioc-version' is what adds the Bioconductor repositories, without which
      # GenomicRanges, csaw, edgeR and the rest are not resolvable
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          bioc-version: ${{ matrix.config.bioc }}
          use-public-rspm: true

      # 'Suggests' are installed by default, so ComplexHeatmap, DESeq2, BiocStyle
      # and variancePartition must NOT be repeated here: a package named both in
      # DESCRIPTION and in 'extra-packages' gives pak two direct references to
      # reconcile, which fails
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, bioc::BiocCheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"warning"'
          args: 'c("--no-manual", "--timings")'
          build_args: 'c("--no-manual")'
          upload-snapshots: true

      # Checks that belong to the repository rather than to the tarball: stray
      # files, unwanted history, oversized objects
      - name: BiocCheckGitClone
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.bioc == 'devel'
        run: BiocCheck::BiocCheckGitClone(".")
        shell: Rscript {0}

      # Drop 'new-package' once the package has been accepted: it turns the
      # version numbering and the support site rules into errors
      - name: BiocCheck
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.bioc == 'devel'
        run: |
          BiocCheck::BiocCheck(
            ".",
            `quit-with-status` = TRUE,
            `new-package` = TRUE
          )
        shell: Rscript {0}
